<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>Social Wars: Reborn</title>
        <link rel="shortcut icon" href="img/icon.png"/>
        <link rel="icon" type="image/gif" href="img/icon.png"/>
        <style>
            * {
                box-sizing: border-box;
            }
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #0d1109;
            }
            #game-container {
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
            }
            embed#swf {
                width: 100%;
                height: 100%;
                display: block;
                border: none;
                outline: none;
            }
        </style>
    </head>
    <body>
        <div id="game-container">
            <embed id="swf"
                src="{{public_url or 'http://127.0.0.1:5055'}}/static/socialwars/flash/SWLoader.swf?t={{serverTime}}&swftoload=/static/socialwars/flash/{{GAMEVERSION}}?t={{serverTime}}"
                allowFullScreen="true"
                bgcolor="#1a1f16"
                quality="autohigh"
                wmode="direct"
                width="100%"
                height="100%"
                name="se"
                align="middle"
                type="application/x-shockwave-flash"
                pluginspage="http://www.macromedia.com/go/getflashplayer"
                flashvars='spdebug=notnull&brk=0
                &staticUrl={{public_url or 'http://127.0.0.1:5055'}}/static/socialwars/&brk=0
                &dynamicUrl={{public_url or 'http://127.0.0.1:5055'}}/dynamic/menvswomen/srvsexwars/&brk=0
                &skiphash12341=notnull&brk=0
                &fb_sig_user={{save_info.userid}}&brk=0
                &user_key=123456789&brk=0
                &language=en&brk=0
                &accessToken=AAABbZAm0wdMUBALsOrR0Ho68CLjaOT8SV3vftKg9mbo1zZColaW5FljRVaLxPGxXXnm1M98mTZCAttcQ4GHwvSyXfsyxYmvKMH8Hmn5iliSPnjvIsZA6&brk=0
                &sex=m&brk=0
                &lastLoggedIn=1349266517&brk=0
                &dailyBonus=0&brk=0
                &friendsInfo={{friendsInfo | tojson}}&brk=0
                &serverTime={{serverTime}}&brk=0
                &forceSyncError=1&brk=0
                &forceAttackReload=0&brk=0
                &forceQuestReload=0&brk=0'>
            </embed>
        </div>
        <script>
            // Keyboard Zoom Shortcuts (+ / -)
            window.addEventListener('keydown', function(e) {
                var swf = document.getElementById('swf');
                if (swf && typeof swf.zoomMap === 'function') {
                    if (e.key === '+' || e.key === '=' || e.keyCode === 187 || e.keyCode === 107) {
                        swf.zoomMap(1);
                    } else if (e.key === '-' || e.key === '_' || e.keyCode === 189 || e.keyCode === 109) {
                        swf.zoomMap(-1);
                    }
                }
            });

            // Dynamic Flash quality switch
            window.setFlashQuality = function(q) {
                var swf = document.getElementById('swf');
                if (swf) {
                    swf.setAttribute('quality', q);
                }
            };
        </script>
    </body>
</html>
